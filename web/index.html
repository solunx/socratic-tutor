<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1419" />
  <title>Socratic Tutor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel2: #243044;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --tutor: #3ecf8e;
      --you: #7aa2ff;
      --warn: #f0c14d;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    #login-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(10,14,20,0.92); align-items: center; justify-content: center;
      flex-direction: column; padding: 24px;
    }
    #login-overlay.show { display: flex; }
    #login-box {
      background: var(--panel); border: 1px solid #2a3548; border-radius: 14px;
      padding: 24px; width: min(360px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    #login-box h1 { margin: 0 0 8px; font-size: 1.2rem; }
    #login-box p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
    #login-box label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
    #login-box input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a3548;
      background: var(--panel2); color: var(--text); font-size: 1rem; box-sizing: border-box;
    }
    #login-box button {
      margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--accent); color: #0a0e14; font-weight: 600; cursor: pointer; font-size: 1rem;
    }
    #login-error { color: #f87171; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    #user-badge { font-size: 0.75rem; color: var(--muted); margin-left: 8px; }
    body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; min-height: 100dvh; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: var(--panel);
      border-bottom: 1px solid #2a3548; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; flex: 1; }
    .badge { font-size: 0.7rem; color: var(--muted); background: var(--panel2); padding: 4px 8px; border-radius: 999px; }
    .icon-btn {
      background: var(--panel2); border: none; color: var(--text);
      width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 1rem;
    }
    .layout { display: flex; flex: 1; min-height: 0; }
    #sidebar {
      display: none; width: 260px; flex-shrink: 0;
      background: var(--panel); border-right: 1px solid #2a3548;
      padding: 12px; overflow-y: auto;
    }
    #sidebar.open { display: block; }
    @media (max-width: 700px) {
      #sidebar {
        position: absolute; z-index: 20; top: 52px; left: 0; right: 0;
        width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid #2a3548;
      }
    }
    #sidebar h2 {
      margin: 0 0 8px; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted);
    }
    .subject {
      padding: 10px 12px; margin: 0 0 8px;
      background: var(--panel2); border-radius: 10px; cursor: pointer;
      border: 1px solid transparent;
    }
    .subject.active { border-color: var(--accent); }
    .subject .title { font-weight: 600; font-size: 0.95rem; }
    .subject .meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #log {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble {
      max-width: 92%; padding: 10px 14px; border-radius: var(--radius);
      line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }
    .bubble.you { align-self: flex-end; background: #1e3a5f; border: 1px solid #2d4a6f; }
    .bubble.tutor { align-self: flex-start; background: #1a3328; border: 1px solid #2a4a3a; }
    .bubble.system { align-self: center; background: transparent; color: var(--muted); font-size: 0.85rem; max-width: 100%; text-align: center; }
    .bubble .who { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .bubble .meta { font-size: 0.7rem; color: var(--muted); margin-top: 6px; }
    .bubble.streaming::after { content: "|"; animation: blink 1s step-end infinite; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }
    #composer {
      display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: var(--panel); border-top: 1px solid #2a3548;
    }
    #input {
      flex: 1; resize: none; min-height: 44px; max-height: 140px;
      background: var(--panel2); color: var(--text); border: 1px solid #2a3548;
      border-radius: 12px; padding: 10px 12px; font: inherit;
    }
    #input.busy { opacity: 0.7; }
    #send {
      background: var(--accent); color: #fff; border: none; border-radius: 12px;
      padding: 0 16px; font-weight: 600; cursor: pointer;
    }
    #send:disabled { opacity: 0.5; }
    #status { font-size: 0.75rem; color: var(--muted); padding: 0 14px 6px; }
    #subjectBadge {
      font-size: 0.72rem; color: var(--tutor);
      background: #1a3328; border: 1px solid #2a4a3a;
      padding: 4px 10px; border-radius: 999px; max-width: 42vw;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #subjectBadge.empty { color: var(--muted); background: var(--panel2); border-color: #2a3548; }
    .bubble.tree .body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem; line-height: 1.35; white-space: pre;
      overflow-x: auto;
    }
    .bubble.resume-head {
      align-self: stretch; max-width: 100%;
      background: var(--panel2); border: 1px dashed #3a4a60;
      color: var(--muted); font-size: 0.85rem; text-align: left;
    }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div id="login-box">
      <h1>Socratic Tutor</h1>
      <p>Log in met je account. Elke gebruiker heeft een eigen leerstate.</p>
      <label for="login-user">Gebruikersnaam</label>
      <input id="login-user" autocomplete="username" autocapitalize="none" />
      <label for="login-pass">Wachtwoord</label>
      <input id="login-pass" type="password" autocomplete="current-password" />
      <button type="button" id="login-btn">Inloggen</button>
      <div id="login-error"></div>
    </div>
  </div>

  <header>
    <button class="icon-btn" id="btnSubjects" title="Onderwerpen">☰</button>
    <h1>Socratic Tutor</h1>
    <span class="badge empty" id="subjectBadge" title="Actief onderwerp">—</span>
    <span class="badge" id="modelBadge">…</span>
    <button class="icon-btn" id="btnState" title="State">ⓘ</button>
    <span id="user-badge"></span>
    <button type="button" id="btn-logout" title="Uitloggen" style="margin-left:8px;font-size:0.75rem;padding:4px 8px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;">Uit</button>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <h2>Onderwerpen</h2>
      <div id="subjectList"></div>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:12px">
        Tik een onderwerp om die chat te tonen. Geschiedenis blijft per onderwerp bewaard.
      </p>
    </aside>
    <div class="main">
      <div id="status">Laden…</div>
      <div id="log"></div>
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Typ of plak hier… (Enter = stuur)"></textarea>
        <button id="send">Stuur</button>
      </div>
    </div>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const sidebar = document.getElementById("sidebar");
    const subjectList = document.getElementById("subjectList");
    const statusEl = document.getElementById("status");
    const modelBadge = document.getElementById("modelBadge");
    const subjectBadge = document.getElementById("subjectBadge");

    let inFlight = false;
    let activeThread = "_lobby";
    let subjects = [];
    /** Bound after login/bootstrap — reject API payloads for another account. */
    let expectedUser = null;

    function subjectTitle(id) {
      if (!id || id === "_lobby") return "Lobby";
      const s = subjects.find((x) => x.id === id);
      return (s && (s.title || s.id)) || id;
    }

    function setActiveSubject(id) {
      activeThread = id || "_lobby";
      const title = subjectTitle(activeThread);
      if (title) {
        subjectBadge.textContent = title;
        subjectBadge.classList.remove("empty");
        subjectBadge.title = "Actief: " + title + " (" + activeThread + ")";
      } else {
        subjectBadge.textContent = "geen onderwerp";
        subjectBadge.classList.add("empty");
        subjectBadge.title = "Geen actief onderwerp";
      }
      renderSubjects(subjects);
    }

    function lastBubbleText(role) {
      const nodes = log.querySelectorAll(".bubble." + role + " .body");
      if (!nodes.length) return "";
      return (nodes[nodes.length - 1].textContent || "").trim();
    }

    function textsRoughlyEqual(a, b) {
      const norm = (s) => (s || "").replace(/\s+/g, " ").trim().toLowerCase();
      const na = norm(a), nb = norm(b);
      if (!na || !nb) return false;
      if (na === nb) return true;
      if (na.length > 40 && nb.includes(na.slice(0, 40))) return true;
      if (nb.length > 40 && na.includes(nb.slice(0, 40))) return true;
      return false;
    }

    function addBubble(role, text, meta) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      if (role === "you" || role === "tutor") {
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = role === "you" ? "Jij" : "Tutor";
        div.appendChild(who);
      }
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text || "";
      div.appendChild(body);
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function clearLog() {
      log.innerHTML = "";
    }

    function renderHistory(hist) {
      clearLog();
      (hist || []).forEach((h) => addBubble(h.role, h.text));
    }

    function renderSubjects(list) {
      subjects = list || [];
      subjectList.innerHTML = "";
      // Lobby always first
      const lobbyEl = document.createElement("div");
      lobbyEl.className = "subject" + (activeThread === "_lobby" ? " active" : "");
      lobbyEl.innerHTML = '<div class="title">Lobby</div><div class="meta">Overzicht · wisselen · /tree · /review</div>';
      lobbyEl.onclick = () => selectLobby();
      subjectList.appendChild(lobbyEl);
      if (!subjects.length) {
        const p = document.createElement("p");
        p.style.cssText = "color:var(--muted);font-size:0.85rem";
        p.textContent = "Nog geen onderwerpen. Typ /new … of vraag het in de lobby.";
        subjectList.appendChild(p);
        return;
      }
      subjects.forEach((s) => {
        const el = document.createElement("div");
        el.className = "subject" + (s.id === activeThread ? " active" : "");
        el.innerHTML =
          '<div class="title"></div><div class="meta"></div>';
        el.querySelector(".title").textContent = s.title || s.id;
        const bits = [];
        if (s.status) bits.push(s.status);
        if (s.concepts != null) bits.push(s.concepts + " concepten");
        if (s.open_mc) bits.push(s.open_mc + " open MC");
        el.querySelector(".meta").textContent = bits.join(" · ") || s.id;
        el.onclick = () => selectSubject(s);
        subjectList.appendChild(el);
      });
    }

    async function selectLobby() {
      setActiveSubject("_lobby");
      statusEl.textContent = "Lobby";
      try {
        const r = await apiFetch("/api/thread/" + encodeURIComponent("_lobby"));
        const data = await r.json();
        renderHistory(data.history || []);
        if (!(data.history || []).length) {
          addBubble("tutor", "Lobby: overzicht en navigatie. Welke onderwerpen heb je, of waarmee wil je verder?");
        }
        statusEl.textContent = "Lobby · meta";
      } catch (e) {
        addBubble("system", "Lobby laden mislukt: " + e.message);
      }
      if (window.innerWidth < 700) sidebar.classList.remove("open");
    }

    async function selectSubject(s) {

      setActiveSubject(s.id);
      statusEl.textContent = "Laden: " + (s.title || s.id);
      try {
        const r = await apiFetch("/api/thread/" + encodeURIComponent(s.id));
        const data = await r.json();
        setActiveSubject(data.thread_id || s.id);
        renderHistory(data.history || []);
        statusEl.textContent = (s.title || s.id) + " · " + ((data.history || []).length) + " berichten";
        // Resume learning on this subject if needed
        if (!(data.history || []).length) {
          input.value = "ik wil verder met " + (s.title || s.id);
        }
      } catch (e) {
        addBubble("system", "Kon thread niet laden: " + e.message);
      }
      if (window.innerWidth < 700) sidebar.classList.remove("open");
    }

    function formatStats(stats) {
      if (!stats) return "";
      const bits = [];
      if (stats.eval_count != null) bits.push("out=" + stats.eval_count);
      if (stats.prompt_eval_count != null) bits.push("in=" + stats.prompt_eval_count);
      if (stats.total_s != null) bits.push(stats.total_s + "s");
      if (stats.ttft_s != null) bits.push("ttft=" + stats.ttft_s);
      return bits.join(" · ");
    }


    function apiFetch(url, opts) {
      opts = opts || {};
      opts.credentials = "same-origin";
      opts.cache = "no-store";
      if (opts.headers && opts.body && !opts.headers["Content-Type"]) {
        /* keep */
      }
      // Bust intermediary caches on GETs (tunnel / browser)
      if (!opts.method || opts.method.toUpperCase() === "GET") {
        const sep = url.indexOf("?") >= 0 ? "&" : "?";
        url = url + sep + "_ts=" + Date.now();
      }
      return fetch(url, opts);
    }

    function assertUser(data, context) {
      if (!data || !data.user_id) return true;
      if (!expectedUser) {
        expectedUser = data.user_id;
        return true;
      }
      if (data.user_id !== expectedUser) {
        statusEl.textContent =
          "Isolatie-fout: verwacht " + expectedUser + " maar server gaf " +
          data.user_id + " (" + (context || "") + "). Log opnieuw in.";
        subjects = [];
        renderSubjects([]);
        showLogin("Account-mismatch — log opnieuw in als " + expectedUser);
        return false;
      }
      return true;
    }

    function showLogin(msg) {
      const ov = document.getElementById("login-overlay");
      if (ov) ov.classList.add("show");
      const err = document.getElementById("login-error");
      if (err && msg) err.textContent = msg;
    }
    function hideLogin() {
      const ov = document.getElementById("login-overlay");
      if (ov) ov.classList.remove("show");
    }

    async function doLogout() {
      try {
        await apiFetch("/api/auth/logout", { method: "POST" });
      } catch (e) {}
      expectedUser = null;
      subjects = [];
      activeThread = "_lobby";
      renderHistory([]);
      const badge = document.getElementById("user-badge");
      if (badge) badge.textContent = "";
      showLogin();
      statusEl.textContent = "Uitgelogd.";
    }

    async function doLogin() {
      const u = (document.getElementById("login-user").value || "").trim();
      const pw = document.getElementById("login-pass").value || "";
      const err = document.getElementById("login-error");
      err.textContent = "";
      try {
        expectedUser = null;
        const r = await apiFetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: pw }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          err.textContent = data.detail || "Login mislukt";
          return;
        }
        expectedUser = data.user_id || u.toLowerCase();
        hideLogin();
        const badge = document.getElementById("user-badge");
        if (badge) badge.textContent = data.display_name || data.user_id || "";
        await bootstrap();
        // Cookie not stored (e.g. Secure on HTTP) → still logged-out
        const ov = document.getElementById("login-overlay");
        if (ov && ov.classList.contains("show")) {
          err.textContent =
            "Login OK maar sessie-cookie werd niet bewaard. Open de site via HTTPS, " +
            "of zet op de server TUTOR_COOKIE_SECURE=0 en herstart de gateway.";
        }
      } catch (e) {
        err.textContent = e.message || String(e);
      }
    }

    async function bootstrap() {
      try {
        const r = await apiFetch("/api/bootstrap");
        const data = await r.json();
        if (r.status === 401 || data.auth_required) {
          expectedUser = null;
          showLogin();
          statusEl.textContent = "Inloggen…";
          return;
        }
        if (data.user_id) {
          if (!expectedUser) expectedUser = data.user_id;
          if (!assertUser(data, "bootstrap")) return;
          const badge = document.getElementById("user-badge");
          if (badge) badge.textContent = data.user_id;
        }

        modelBadge.textContent = data.model || "tutor";
        subjects = data.subjects || [];
        renderSubjects(subjects);
        setActiveSubject(data.thread_id || "_lobby");
        renderHistory(data.history || []);
        const n = subjects.length;
        statusEl.textContent =
          "Klaar · " + (data.user_id || "") + " · " + n + " onderwerp(en). Tik ☰ of typ wat je wilt leren.";
      } catch (e) {
        statusEl.textContent = "Gateway offline? " + e.message;
      }
    }

    function handleResult(data, opts) {
      opts = opts || {};
      if (!assertUser(data, "turn")) return;
      // Cookie may change if another tab logged in as someone else
      if (data.user_id) {
        const badge = document.getElementById("user-badge");
        if (badge) {
          const prev = badge.textContent || "";
          badge.textContent = data.user_id;
          if (prev && prev !== data.user_id) {
            statusEl.textContent = "Account gewisseld naar " + data.user_id + " (andere tab?)";
          }
        }
      }
      if (data.subjects) {
        subjects = data.subjects;
        renderSubjects(subjects);
      }
      const prevThread = activeThread;
      if (data.thread_id) setActiveSubject(data.thread_id);

      // NL switch / resume: show per-subject chat history (same as sidebar)
      if (Array.isArray(data.history) && data.thread_id && data.kind !== "subjects") {
        if (data.thread_id !== prevThread || data.kind === "resume") {
          renderHistory(data.history);
        }
      }

      if (data.kind === "lobby") {
        setActiveSubject("_lobby");
        if (data.response) addBubble("tutor", data.response);
        if (data.subjects) renderSubjects(data.subjects);
        return;
      }
      // tree handled with state/help below (deduped)
      if (data.kind === "subjects") {
        const names = (data.subjects || []).map((s) => s.title).join(", ") || "geen";
        addBubble("system", "Onderwerpen: " + names);
        if (data.response && !textsRoughlyEqual(data.response, names)) {
          addBubble("tutor", data.response);
        }
        return;
      }
      if (data.kind === "resume") {
        const r = data.resume || {};
        let head = "Hervat: " + (r.title || subjectTitle(data.thread_id) || "");
        if (r.goal) head += "\nLeerdoel: " + r.goal;
        if (r.recent_concepts && r.recent_concepts.length) {
          head += "\nRecent: " + r.recent_concepts.map((c) => c.title).join(", ");
        }
        // One resume banner only (not duplicated if already shown)
        if (!textsRoughlyEqual(lastBubbleText("system"), head) &&
            !textsRoughlyEqual(lastBubbleText("system"), "Hervat: " + (r.title || ""))) {
          const b = addBubble("system", head);
          b.classList.add("resume-head");
        }
        const q = (data.response || r.resume_question || "").trim();
        // Single question: skip if already streamed or same as last tutor line
        if (q && !opts.streamedBody && !textsRoughlyEqual(lastBubbleText("tutor"), q)) {
          addBubble("tutor", q, "ophalen");
        } else if (opts.streamedBody && data.stats) {
          const bubbles = log.querySelectorAll(".bubble.tutor");
          const last = bubbles[bubbles.length - 1];
          if (last && !last.querySelector(".meta")) {
            const m = document.createElement("div");
            m.className = "meta";
            m.textContent = formatStats(data.stats) || "ophalen";
            last.appendChild(m);
          }
        }
        return;
      }
      if ((data.kind === "state" || data.kind === "state_full" || data.kind === "help" ||
           data.kind === "quit" || data.kind === "reset" || data.kind === "debug" ||
           data.kind === "tree") && data.response) {
        // Avoid exact double bubble (history + handleResult)
        if (!textsRoughlyEqual(lastBubbleText("system"), data.response) &&
            !textsRoughlyEqual(lastBubbleText("tutor"), data.response)) {
          const cls = data.kind === "tree" ? "tutor" : "system";
          const div = addBubble(cls, data.response);
          if (data.kind === "tree") div.classList.add("tree");
        }
        return;
      }
      if (!opts.streamedBody && data.response) {
        if (!textsRoughlyEqual(lastBubbleText("tutor"), data.response)) {
          addBubble("tutor", data.response, formatStats(data.stats));
        }
      } else if (opts.streamedBody && data.stats) {
        const bubbles = log.querySelectorAll(".bubble.tutor");
        const last = bubbles[bubbles.length - 1];
        if (last && !last.querySelector(".meta")) {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = formatStats(data.stats);
          last.appendChild(m);
        }
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || inFlight) return;
      inFlight = true;
      sendBtn.disabled = true;
      input.classList.add("busy");
      addBubble("you", text);
      input.value = "";
      autoSize();

      const isCmd = text.startsWith("/");
      let tutorBubble = null;
      let streamed = false;
      let bodyEl = null;

      try {
        let r = await apiFetch("/api/v1/turn/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
          body: JSON.stringify({
            message: text,
            agent: "tutor",
            thread_id: activeThread === "_lobby" ? null : activeThread,
          }),
        });
        if (!r.ok) {
          // Fallback non-stream (shows server detail if any)
          let detail = "";
          try {
            const errBody = await r.json();
            detail = errBody.detail ? (" " + JSON.stringify(errBody.detail)) : "";
          } catch (_) {}
          const r2 = await apiFetch("/api/v1/turn", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              agent: "tutor",
              thread_id: activeThread === "_lobby" ? null : activeThread,
            }),
          });
          if (!r2.ok) {
            let d2 = detail;
            try {
              const eb = await r2.json();
              d2 = eb.detail ? (" " + JSON.stringify(eb.detail)) : d2;
            } catch (_) {}
            throw new Error("HTTP " + r2.status + d2);
          }
          const data = await r2.json();
          handleResult(data, { streamedBody: false });
          statusEl.textContent = subjectTitle(data.thread_id) || data.thread_id || "Klaar";
          return;
        }
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let finalData = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) {
            const line = part.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            let ev;
            try { ev = JSON.parse(line.slice(6)); } catch (_) { continue; }
            if (ev.type === "token") {
              if (!tutorBubble) {
                tutorBubble = addBubble("tutor", "");
                tutorBubble.classList.add("streaming");
                bodyEl = tutorBubble.querySelector(".body");
                streamed = true;
              }
              bodyEl.textContent += (ev.text || "");
              log.scrollTop = log.scrollHeight;
            } else if (ev.type === "done") {
              finalData = ev;
              if (tutorBubble) tutorBubble.classList.remove("streaming");
            }
          }
        }

        if (finalData) {
          handleResult(finalData, { streamedBody: streamed && !isCmd });
          if (streamed && finalData.response && bodyEl && !bodyEl.textContent.trim()) {
            bodyEl.textContent = finalData.response;
          }
          statusEl.textContent = subjectTitle(finalData.thread_id) || finalData.thread_id || "Klaar";
        }
      } catch (e) {
        addBubble("system", "Netwerkfout: " + e.message);
      } finally {
        inFlight = false;
        sendBtn.disabled = false;
        input.classList.remove("busy");
        input.focus();
      }
    }

    function autoSize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("input", autoSize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    document.getElementById("btnSubjects").onclick = () => sidebar.classList.toggle("open");
    document.getElementById("btnState").onclick = () => {
      input.value = "/state";
      send();
    };

    const logoutBtn = document.getElementById("btn-logout");
    if (logoutBtn) logoutBtn.addEventListener("click", doLogout);
    const loginBtn = document.getElementById("login-btn");
    if (loginBtn) {
      loginBtn.onclick = doLogin;
      const passEl = document.getElementById("login-pass");
      if (passEl) {
        passEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") doLogin();
        });
      }
    }
    bootstrap();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        apiFetch("/api/auth/me").then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!data.ok || !data.user_id) {
            showLogin();
            return;
          }
          const badge = document.getElementById("user-badge");
          const shown = badge ? badge.textContent : "";
          if (shown && shown !== data.user_id) {
            if (badge) badge.textContent = data.user_id;
            await bootstrap();
          }
        }).catch(() => {});
      }
    });

    input.focus();
  </script>
</body>
</html>
